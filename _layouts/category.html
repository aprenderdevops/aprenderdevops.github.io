---
layout: default
---
{% assign entradas_categoria = site.categories[page.category_name] %}
<header class="archive-description">
	<h1 class="archive-title">Categoría: {{ page.title }}</h1>
	{% if page.descripcion %}<p>{{ page.descripcion }}</p>{% endif %}
</header>
{% for post in entradas_categoria %}
{% include entry.html post=post %}
{% endfor %}
