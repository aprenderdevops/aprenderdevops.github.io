---
layout: default
---
<article class="entry" aria-label="{{ page.title | strip_html }}">
	{% include entry-header.html post=page tipo="single" %}
	<div class="entry-content">
		{% if page.image %}
		<div class="featured-image"><img src="{{ page.image }}" alt="{{ page.title | strip_html }}" class="entry-image"></div>
		{% endif %}
		{{ content }}
	</div>
	{% include entry-footer.html post=page %}
</article>
