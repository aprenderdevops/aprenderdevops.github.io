url: 'https://aprenderdevops.com'
name: aprenderDevOps
description: 'Aprendiendo DevOps'

# Misma propiedad GA4 que ya usa el WordPress original, para no perder
# continuidad del histórico de datos entre ambos sitios.
google_analytics_id: G-BCNKP12W4P

# El tema vive en este repo (_layouts/_includes/assets), no en un gem. Hay que
# declararlo vacío explícitamente porque el gem github-pages, si no, activa
# jekyll-theme-primer por defecto, cuyo assets/css/style.scss se genera en la
# misma ruta que nuestro assets/css/style.css y lo pisa (ver CLAUDE.md).
theme:

plugins:
  - jekyll-paginate

paginate: 3
paginate_path: '/page/:num/'

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - hooks
  - scripts
